<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10091f"><title>Sign in | PixelViva Creative Studio">
<style>
:root{--bg:#10091f;--gold:#ffd783;--purple:#b66bff;--white:#fff9f0;--muted:#c8bdd6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 0%,#402052,transparent 36%),var(--bg);color:var(--white);font:16px/1.6 Inter,system-ui,Arial,sans-serif}.panel{width:min(460px,100%);border:1px solid #b66bff66;border-radius:26px;padding:clamp(24px,6vw,42px);background:linear-gradient(145deg,#251638,#170d27);box-shadow:0 25px 80px #0005}.logo{font-size:1.4rem;font-weight:900}.logo span{color:var(--purple)}.eyebrow{color:var(--gold);font-size:.75rem;letter-spacing:3px;font-weight:850;text-transform:uppercase}h1{font-size:2.3rem;line-height:1.05;letter-spacing:-1.5px;margin:12px 0}p{color:var(--muted)}label{display:block;margin:15px 0 6px;font-weight:700;font-size:.9rem}input{width:100%;padding:13px 14px;border:1px solid #ffffff25;border-radius:12px;background:#10091f;color:white;font:inherit}input:focus{outline:2px solid var(--purple)}.btn{width:100%;display:block;text-align:center;border:0;border-radius:999px;padding:13px 18px;margin-top:20px;background:linear-gradient(110deg,var(--gold),#fff0bc);color:#241137;font-weight:900;font-size:1rem;cursor:pointer}.alt{display:block;text-align:center;margin-top:16px;color:var(--gold)}.back{display:inline-block;margin-bottom:24px;color:var(--muted)}.notice{font-size:.85rem;padding:12px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff16}
</style></head><body><main class="panel"><a class="back" href="index.html">← Back to website</a><div class="logo">Pixel<span>Viva</span></div><div class="eyebrow">Client access</div><h1>Welcome back.</h1><p>Sign in to continue to your PixelViva client account.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="btn" type="submit">Sign in</button></form>
<p class="notice" id="notice">Demo page only: login is not connected to an authentication service yet. No password is stored or sent.</p><a class="alt" href="signup.html">New here? Create an account →</a><a class="alt" href="mailto:piyushtiwaricsa@gmail.com?subject=PixelViva%20Account%20Help">Need help? Contact support</a></main>
<script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('notice').textContent='This is a visual login page only. To enable secure sign-in, connect an authentication provider first. Your password has not been sent or stored.';});</script>
</body></html>
